{% extends "base.html" %}
{% block content %}
<h2>Add Book</h2>
<form method="POST">
    Title: <input type="text" name="title"><br>
    ISBN: <input type="text" name="isbn"><br>
    Author: <input type="text" name="author"><br>
    Year: <input type="number" name="year"><br>
    <input type="submit" value="Add Book">
</form>
{% endblock %}
