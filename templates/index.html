{% extends "base.html" %}
{% block content %}
<h2>Book List</h2>
<table border="1">
    <tr>
        <th>ID</th><th>Title</th><th>ISBN</th><th>Author</th><th>Year</th><th>Actions</th>
    </tr>
    {% for book in books %}
    <tr>
        <td>{{ book[0] }}</td>
        <td>{{ book[1] }}</td>
        <td>{{ book[2] }}</td>
        <td>{{ book[3] }}</td>
        <td>{{ book[4] }}</td>
        <td>
            <a href="{{ url_for('edit_book', book_id=book[0]) }}">Edit</a> |
            <a href="{{ url_for('delete_book', book_id=book[0]) }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
